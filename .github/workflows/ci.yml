name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (nvim ${{ matrix.nvim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # librsvg2-bin provides rsvg-convert, the rasterizer the render tests use.
      - name: Install rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install MathJax
        run: npm install --no-audit --no-fund

      - name: Daemon serialization specs
        run: node tests/daemon_xml_spec.mjs

      - name: Checkout plenary
        uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: .tests/plenary.nvim

      - name: Run tests
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests
