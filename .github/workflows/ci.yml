name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same ref makes the first run's result moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (nvim ${{ matrix.nvim }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
        node: [20]
        # 18 is the floor the docs and package.json advertise, so it is tested,
        # once rather than against every nvim.
        include:
          - nvim: stable
            node: 18
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # librsvg2-bin provides rsvg-convert, the rasterizer the render tests use.
      - name: Install rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install MathJax
        run: npm install --no-audit --no-fund

      - name: Daemon serialization specs
        run: node tests/daemon_xml_spec.mjs

      - name: Checkout plenary
        uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: .tests/plenary.nvim

      - name: Checkout snacks.nvim
        uses: actions/checkout@v4
        with:
          repository: folke/snacks.nvim
          path: .tests/snacks.nvim

      # Without the latex parser every .tex test takes the regex path and the
      # LaTeX query is never executed (#22). tree-sitter-latex does not ship a
      # generated parser.c, so the CLI is needed to build it.
      - name: Build the latex parser
        run: |
          npm install -g --no-audit --no-fund tree-sitter-cli@0.27.0
          make parsers

      # snacks and the latex parser are provided above, so a skip here means
      # something broke.
      - name: Run tests
        run: make test
        env:
          EQNAV_REQUIRE_SNACKS: "1"
          EQNAV_REQUIRE_LATEX: "1"

  # doc/eqnav.txt is hand-written; a duplicate or malformed tag would otherwise
  # first surface as a user's :help eqnav failing. A bare :helptags reports E154
  # and still exits 0, hence the try/cquit.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Generate help tags
        run: |
          nvim --headless -u NONE \
            -c 'try | helptags doc | catch | echo v:exception | cquit | endtry' \
            -c 'qa!'
          test -s doc/tags

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests
